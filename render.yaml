services:
  - type: web
    name: upike-football
    runtime: python
    plan: free
    buildCommand: bash render-build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:////tmp/upike_intel.sqlite3
      - key: password
        sync: false
