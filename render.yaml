services:
  - type: web
    name: upike-football
    runtime: python
    plan: free
    buildCommand: bash render-build.sh
    startCommand: alembic -c backend/alembic.ini upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: password
        sync: false
